market_feed.import:
  path: '/api/market-feed/import'
  defaults:
    _controller: '\Drupal\market_feed\Controller\MarketFeedImportController::import'
  methods: [POST]
  requirements:
    _permission: 'import market feed prices'

market_feed.page:
  path: '/market-feed'
  defaults:
    _controller: '\Drupal\market_feed\Controller\MarketFeedController::page'
    _title: 'Market feed'
  requirements:
    _permission: 'view market feed prices'

